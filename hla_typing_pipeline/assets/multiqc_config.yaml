# MultiQC Configuration for HLA Typing Pipeline

title: "HLA Typing Pipeline Report"
subtitle: "Multi-tool HLA typing with consensus voting"
intro_text: "This report aggregates quality control metrics and HLA typing results from the pipeline."

report_comment: >
    This report was generated by the HLA Typing Pipeline. It includes FastQC metrics
    for input data quality and summary statistics for HLA typing results.

show_analysis_paths: False
show_analysis_time: True

log_filesize_limit: 10000000

# Report sections order
report_section_order:
    - fastqc
    - software_versions

# Custom data configuration
custom_data:
    hla_summary:
        file_format: 'tsv'
        section_name: 'HLA Typing Summary'
        description: 'Summary of HLA typing results across all samples'
        plot_type: 'table'
        pconfig:
            id: 'hla_summary_table'
            title: 'HLA Typing Summary'

# Extra search patterns
sp:
    fastqc/zip:
        fn: '*_fastqc.zip'
    fastqc/html:
        fn: '*_fastqc.html'

# Exclude certain modules
exclude_modules:
    - 'general_stats'

# Table columns
table_columns_visible:
    FastQC:
        percent_duplicates: True
        percent_gc: True
        avg_sequence_length: True
        total_sequences: True
        percent_fails: False

# Custom colors
custom_logo: null
custom_logo_url: null
custom_logo_title: null

# Plot configuration
plots_force_flat: False
plots_force_interactive: True

# Export options
export_plots: True
